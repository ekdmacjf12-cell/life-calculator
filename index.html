<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생활계산소</title>
<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f7fb;
  text-align:center;
}
header{
  background:#315efb;
  color:white;
  padding:30px 15px;
}
main{
  max-width:600px;
  margin:30px auto;
  padding:20px;
}
.card{
  background:white;
  padding:25px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 3px 12px #ddd;
}
button{
  background:#315efb;
  color:white;
  border:0;
  padding:12px 25px;
  border-radius:8px;
}
</style>
</head>
<body>

<header>
<h1>생활계산소</h1>
<p>쉽고 빠른 생활 계산기</p>
</header>

<main>
<div class="card">
<h2>💰 월급 계산기</h2>
<p>생활에 필요한 계산기를 쉽게 이용하세요.</p>
<button>계산기 준비중</button>
</div>

<div class="card">
<h2>🏠 대출 이자 계산기</h2>
<p>대출 금액과 이자를 계산해보세요.</p>
<button>계산기 준비중</button>
</div>

<div class="card">
<h2>📚 생활정보</h2>
<p>유용한 생활정보를 제공합니다.</p>
</div>
</main>

</body>
</html>
